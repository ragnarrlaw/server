version: "3.9"
services:
    database:
        build:
            context: .
            dockerfile: Dockerfile.postgis
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: server_migration
        ports:
            - "9998:5432"
        volumes:
            - ./postgres/data:/var/lib/postgresql/data
            - ./postgres/init:/docker-entrypoint-initdb.d
    backend:
        build:
            context: .
            dockerfile: Dockerfile.backend
        ports:
            - "9999:9999"
        volumes:
            - ./:/usr/src/backend
        depends_on:
            - database

    osrm:
        image: ghcr.io/project-osrm/osrm-backend
        ports:
            - "5000:5000"
        volumes:
            - ./osrm/data:/data
            - ./osrm/profiles:/profiles
        command: >
            sh -c "if [ ! -f /data/sri-lanka-latest.osrm ]; then
                wget -P /data http://download.geofabrik.de/asia/sri-lanka-latest.osm.pbf &&
                osrm-extract -p /profiles/car.lua /data/sri-lanka-latest.osm.pbf &&
                osrm-partition /data/sri-lanka-latest.osrm &&
                osrm-customize /data/sri-lanka-latest.osrm;
            fi &&
            osrm-routed --algorithm mld /data/sri-lanka-latest.osrm"
